services:
  ohs-report:
    build: .
    image: ohs-report:latest
    container_name: ohs-report
    network_mode: host
    env_file:
      - .env
    environment:
      - SEED_DEMO=${SEED_DEMO:-}
      - LLM_BASE_URL=https://api.deepseek.com/v1/chat/completions
      - LLM_MODEL=deepseek-v4-flash-vision-exp
      - LLM_KEY_ENV=DEEPSEEK_API_KEY
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: ohs-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
