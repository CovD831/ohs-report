<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报告 · 职业病危害预评价报告工作台</title>
<style>
:root {
  --primary: #0F6B5C; --primary-soft: #E3F0ED; --primary-strong: #0A5247;
  --tertiary: #B45309; --success: #15803D; --danger: #B91C1C;
  --neutral: #F2F4F3; --surface: #FFFFFF; --surface-muted: #ECEFEE;
  --border: #DFE3E1; --border-strong: #C4CCC8;
  --text: #1A2521; --text-secondary: #46534E; --text-muted: #8A948F;
  --radius-sm: 3px; --radius-md: 5px; --radius-lg: 8px;
}
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  margin: 0; color: var(--text); background: var(--neutral); font-size: 14px; line-height: 1.7; }
.topbar { background: var(--primary-strong); color: #fff; height: 52px;
  display: flex; align-items: center; padding: 0 20px; position: sticky; top: 0; z-index: 10; }
.topbar .brand { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.topbar .brand-logo { width: 24px; height: 24px; border-radius: 4px; background: rgba(255,255,255,.18);
  display: flex; align-items: center; justify-content: center; font-size: 13px; }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12.5px; }
.topbar a { color: rgba(255,255,255,.85); text-decoration: none; }
.topbar a:hover { color: #fff; }
.toolbar { display: flex; gap: 8px; padding: 14px 24px; align-items: center;
  border-bottom: 1px solid var(--border); background: var(--surface); }
.btn { border: none; border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13px;
  cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-strong); }
.btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
.btn-secondary:hover { border-color: var(--primary); color: var(--primary-strong); }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.layout { display: flex; min-height: calc(100vh - 52px); }
.sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  padding: 16px 12px; overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 52px; }
.toc-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: .05em; margin: 8px 8px 8px; }
.toc-item { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 13px; color: var(--text-secondary); text-decoration: none; }
.toc-item:hover { background: var(--surface-muted); }
.toc-item.active { background: var(--primary-soft); color: var(--primary-strong); font-weight: 600; }
.toc-item.gen::after { content: '✓'; color: var(--success); font-size: 11px; margin-left: auto; font-weight: 700; }
.toc-item.pending::after { content: '·'; color: var(--text-muted); margin-left: auto; }
.content { flex: 1; padding: 28px 40px; max-width: 850px; margin: 0 auto; background: #fff; }
.doc-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: .01em; }
.doc-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
.section-title { font-size: 18px; font-weight: 700; margin: 8px 0 14px; padding-bottom: 10px;
  border-bottom: 2px solid var(--primary); }
.para { margin: 12px 0; text-align: justify; }
.para .muted { color: var(--text-muted); font-size: 13px; }
.table-card { margin: 16px 0; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
.table-title { font-size: 13px; font-weight: 600; padding: 8px 12px; background: var(--surface-muted);
  border-bottom: 1px solid var(--border); color: var(--text-secondary); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { background: var(--surface-muted); color: var(--text-secondary); text-align: left;
  padding: 7px 10px; font-weight: 500; border-bottom: 1px solid var(--border); }
td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
tr:nth-child(even) td { background: var(--surface-muted); }
.empty-block { padding: 32px; text-align: center; color: var(--text-muted); font-size: 13px; }
.progress-ring { display: inline-flex; gap: 8px; align-items: center; color: var(--text-secondary); }
.spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--primary);
  border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.badge { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 600; }
.badge-gray { background: var(--surface-muted); color: var(--text-muted); }
.badge-green { background: #E6F4EA; color: var(--success); }
.gen-progress { padding: 10px 24px; border-bottom: 1px solid var(--border); background: var(--surface-muted); }
.support-block { margin-top: 28px; border-top: 2px solid var(--border); padding-top: 16px; }
.support-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; }
tr.risky td { background: #FFF7E6; }   /* 行级需关注: 浅黄 */
td.risky-cell { background: #FFF1CC; font-weight: 600; color: #B45309; }  /* 超标单元格: 更强黄 */
.mat-detail { padding: 8px 12px; border-left: 3px solid var(--border); margin-bottom: 6px; font-size: 13px; line-height: 1.6; }
.mat-detail.risky { border-left-color: #B45309; background: #FFF7E6; }
.review-hint { background: #FFF7E6; border-left: 4px solid #D97706; padding: 8px 12px; font-size: 12.5px; color: #92400E; margin-bottom: 12px; border-radius: 4px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="brand-logo">预</div>职业病危害预评价报告工作台</div>
  <div class="right"><a href="/">← 返回工作台</a></div>
</div>

<div class="toolbar">
  <h1 style="font-size:16px;margin:0;" id="reportTitle">加载中…</h1>
  <span class="badge badge-gray" id="statusBadge">—</span>
  <div style="margin-left:auto;display:flex;gap:8px;">
    <button class="btn btn-secondary" onclick="window.location.href='/'">重传材料</button>
    <button class="btn btn-primary" onclick="exportWord()">导出 Word</button>
  </div>
</div>

<div class="gen-progress" id="genProgress" style="display:none;">
  <div style="display:flex;align-items:center;gap:8px;font-size:13px;">
    <div class="spinner"></div>
    <span>正在生成全文…</span>
    <div class="progress-bar" style="flex:1;"><div class="progress-fill" id="genFill"></div></div>
    <span id="genText">0%</span>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="toc-label">章节目录</div>
    <div id="toc">加载中…</div>
  </div>
  <div class="content" id="content"><div class="empty-block">选择左侧章节查看内容</div></div>
</div>

<script>
let PID = '{{ pid }}';
let SEC = '1';
let ALL_STATES = {};
// 注入的报告整体结构 (1-12章树) + 数据四级 (产品/工段)
const STRUCT = {{ struct|tojson }};
const PROD4 = {{ prod|tojson }};
// 数据四级并进结构树 (8.4.1 / 10.1.1 三级下长四级)
function mergeProd() {
  const byParent = {};
  PROD4.forEach(([key, title]) => {
    const p = key.slice(0, key.lastIndexOf('.'));   // '8.4.1' 或 '10.1.1'
    (byParent[p] = byParent[p] || []).push({key, title});
  });
  STRUCT.forEach(ch => {
    (ch.children||[]).forEach(s2 => {
      (s2.children||[]).forEach(s3 => {
        if (byParent[s3.key]) {
          s3.children = (s3.children||[]).concat(byParent[s3.key].map(p => ({key:p.key, title:`${p.key} ${p.title}`, level:4, children:[]})));
        }
      });
    });
  });
}
mergeProd();
// 展平结构: key -> {title, level} 映射 (供 buildToc 和寻址)
const KEYMAP = {};
(function flat(nodes){ nodes.forEach(n => { KEYMAP[n.key] = n; (n.children||[]).forEach(n2 => flat([n2])); }); })(STRUCT);
// 一级章节顺序
const CH = STRUCT.map(n => n.key);

async function init() {
  await loadOverview();
  await reloadStates();
  buildToc();
  const firstGen = findFirstGenerated();
  if (firstGen) { loadSection(firstGen); }
  checkGenTask();
}
async function reloadStates() {
  const r = await fetch('/api/projects/' + PID + '/data');
  const d = await r.json();
  ALL_STATES = d.section_states || {};
}
function findFirstGenerated() {
  for (const sec of CH) if (secGenerated(sec)) return sec;
  return null;
}
async function checkGenTask() {
  try {
    const tj = await fetch('/api/tasks');
    const jobs = await tj.json();
    const mine = jobs.find(j => j.pid === PID && (j.status === 'running' || j.status === 'pending'));
    if (mine) {
      document.getElementById('genProgress').style.display = 'block';
      pollGen(mine.id);
    } else {
      await reloadStates(); buildToc();
    }
  } catch(e) {}
}
async function pollGen(jobId) {
  const r = await fetch('/api/tasks/' + jobId);
  const d = await r.json();
  if (d && d.id) {
    const pct = d.total ? Math.round(d.live_progress / d.total * 100) : 0;
    document.getElementById('genFill').style.width = pct + '%';
    document.getElementById('genText').textContent = pct + '% (' + d.live_progress + '/' + d.total + ')';
    await reloadStates(); buildToc();
    if (!secGenerated(SEC)) {
      const gen = findFirstGenerated();
      if (gen) loadSection(gen);
    } else if (SEC && ALL_STATES[SEC] && document.getElementById('content').innerHTML.includes('生成中')) {
      loadSection(SEC);
    }
    if (d.status === 'done' || d.status === 'failed') {
      const gp = document.getElementById('genProgress');
      gp.innerHTML = '<div style="font-size:12px;color:var(--text-muted);">' + (d.status==='done' ? '生成完成 ✓' : '生成已停止') + '</div>';
      document.getElementById('statusBadge').textContent = d.status==='done' ? '生成完成' : '生成失败';
      document.getElementById('statusBadge').className = 'badge ' + (d.status==='done' ? 'badge-green' : 'badge-gray');
      await reloadStates(); buildToc();
      loadSection(SEC || findFirstGenerated() || '1');
      loadOverview();
      return;
    }
  }
  timer = setTimeout(() => pollGen(jobId), 2500);
}
async function loadOverview() {
  const r = await fetch('/api/projects/' + PID + '/overview');
  overview = await r.json();
  document.getElementById('reportTitle').textContent = '职业病危害预评价报告';
  const sb = document.getElementById('statusBadge');
  sb.textContent = (overview.has_data ? `危害${overview.hazard_count} · 判定${overview.judgement_count}` : '待上传材料');
  sb.className = 'badge ' + (overview.has_data ? 'badge-green' : 'badge-gray');
  // 缺料兜底提示: 缺哪些类别 → 影响哪些章节
  const cov = overview.coverage;
  if (cov && cov.missing && cov.missing.length && overview.has_data) {
    const core = cov.core_missing || [];
    const list = (core.length ? core : cov.missing).slice(0, 5);
    let warn = document.getElementById('covHint');
    if (!warn) {
      warn = document.createElement('div');
      warn.id = 'covHint';
      warn.className = 'gen-progress';
      document.getElementById('genProgress').insertAdjacentElement('afterend', warn);
    }
    let msg = '📋 资料完整度 ' + cov.completeness + '%';
    if (core.length) msg += ' · ' + core.length + '项核心资料缺失';
    msg += ' — ' + list.map(m => m.name + '→影响' + m.impact).join('；') + '，缺失章节已标注待补充';
    const col = core.length ? 'var(--danger)' : 'var(--warning)';
    warn.innerHTML = '<span style="font-size:12.5px;color:' + col + ';">' + msg + '</span>';
  }
}
// 目录: 只显示"已生成"的章节, 生成到哪出现到哪; 按结构树层级缩进
function buildToc() {
  let html = '';
  function walk(node, depth) {
    const st = ALL_STATES[node.key];
    if (!st || st.state !== 'generated') return;
    const t = (st.title || node.title).replace(/^#+\s*/,'');
    const pad = 10 + (depth-1) * 14;
    html += `<a class="toc-item ${node.key===SEC?'active':''} gen" style="padding-left:${pad}px;${depth>=3?'font-size:12.5px;':''}" onclick="loadSection('${node.key}')">${t}</a>`;
    (node.children||[]).forEach(c => walk(c, depth+1));
  }
  STRUCT.forEach(n => walk(n, 1));
  document.getElementById('toc').innerHTML = html
    || '<div class="empty-block" style="padding:20px;">正在生成，章节将陆续出现…</div>';
}
function kfmt(key) { return key; }
function secGenerated(sec) {
  return (ALL_STATES[sec] || {}).state === 'generated';
}
async function loadSection(sec) {
  SEC = sec;
  buildToc();
  const st = ALL_STATES[sec];
  if (st && st.state === 'generated' && st.text) {
    document.getElementById('content').innerHTML = renderLLM(sec, st);
    // 内嵌该章数据表 (识别/检测/防护/检查表) 作正文支撑
    loadSupportTables(sec);
    return;
  }
  const r = await fetch('/api/projects/' + PID + '/sections/' + sec);
  const d = await r.json();
  document.getElementById('content').innerHTML = renderSection(sec, d);
}
// 内嵌正文支撑表 (章节对应数据表) + 超标/需关注单元格标黄
async function loadSupportTables(sec) {
  try {
    const r = await fetch('/api/projects/' + PID + '/sections/' + sec);
    const d = await r.json();
    const tables = d.tables || [];
    if (!tables.length) return;
    let h = '';
    tables.forEach(t => {
      h += `<div class="table-card" style="margin-top:18px;"><div class="table-title">${t.name}</div><table><thead><tr>`;
      (t.headers || []).forEach(hd => { h += `<th>${hd}</th>`; });
      h += '</tr></thead><tbody>';
      (t.rows || []).forEach(row => {
        const rowStr = row.join(',');
        const risky = /超标|不合格|超限|严重|需注意|超过/i.test(rowStr);
        h += `<tr${risky?' class="risky"':''}>`;
        row.forEach(c => {
          const cellRisky = /超标|不合格|超限|超过/i.test(String(c));
          h += `<td${cellRisky?' class="risky-cell"':''}>${c ?? ''}</td>`;
        });
        h += '</tr>';
      });
      h += '</tbody></table></div>';
    });
    document.getElementById('content').insertAdjacentHTML('beforeend', h);
  } catch(e) {}
}
// 渲染 LLM 正文 (markdown→HTML) + AI"需人工审核"高亮 (判定/结论段)
function renderLLM(sec, st) {
  const title = (st.title || KEYMAP[sec]?.title || sec).replace(/^#+\s*/,'');
  // 一级/二级/三级章节: AI 生成文字需人工审核 (判定/结论段标黄提示)
  const needsReview = ['6','2','10.4','11','3'].some(p => sec===p || sec.startsWith(p+'.'));
  let h = `<div class="section-title">${title}</div>`;
  if (needsReview) {
    h += `<div class="review-hint">⚠ 本节为 AI 辅助生成，判定性结论需人工审核复核</div>`;
  }
  const lines = (st.text || '').split('\n');
  let inList = false;
  lines.forEach(ln => {
    const s = ln.trim();
    if (!s) return;
    if (s.startsWith('## ') || s.startsWith('# ')) {
      if (inList) { h += '</ul>'; inList = false; }
      h += `<h3 style="font-size:14px;margin:14px 0 6px;">${s.replace(/^#+\s*/,'')}</h3>`;
    } else if (s.startsWith('**') && s.endsWith('**')) {
      if (inList) { h += '</ul>'; inList = false; }
      h += `<h3 style="font-size:14px;margin:12px 0 6px;">${s.replace(/^\*\*|\*\*$/g,'')}</h3>`;
    } else if (s.startsWith('- ')) {
      if (!inList) { h += '<ul style="margin:6px 0;padding-left:20px;">'; inList = true; }
      h += `<li>${s.slice(2)}</li>`;
    } else {
      if (inList) { h += '</ul>'; inList = false; }
      h += `<div class="para">${s}</div>`;
    }
  });
  if (inList) h += '</ul>';
  return h;
}
function renderSection(sec, d) {
  const title = d.title || KEYMAP[sec]?.title || sec;
  let h = `<div class="section-title">${title}</div>`;
  const paras = d.paragraphs || [];
  if (paras.length) {
    paras.forEach(p => { h += `<div class="para">${p}</div>`; });
  } else {
    h += '<div class="para muted">本节点暂无可读文本（数据未生成或待材料）。</div>';
  }
  (d.tables || []).forEach(t => {
    h += `<div class="table-card"><div class="table-title">${t.name}</div><table><thead><tr>`;
    (t.headers || []).forEach(hd => { h += `<th>${hd}</th>`; });
    h += `</tr></thead><tbody>`;
    (t.rows || []).forEach(row => {
      h += `<tr>` + row.map(c => `<td>${c ?? ''}</td>`).join('') + `</tr>`;
    });
    h += `</tbody></table></div>`;
  });
  return h;
}
async function loadStates() {
  const r = await fetch('/api/projects/' + PID + '/data');
  const d = await r.json();
  ALL_STATES = d.section_states || {};
  buildToc();
}
async function exportWord() {
  const r = await fetch('/api/projects/' + PID + '/export');
  const d = await r.json();
  if (d.ok) {
    const a = document.createElement('a');
    a.href = '/api/projects/' + PID + '/download';
    a.download = '职业病危害预评价报告.docx';
    document.body.appendChild(a); a.click(); a.remove();
  } else { alert('导出失败：' + (d.error || '')); }
}
let overview = null;
let timer = null;
init().then(loadStates);
</script>
</body>
</html>
