<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>登录 — 职业病危害预评价报告工作台</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #F3F5F9;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; border-radius: 12px; padding: 40px 44px; width: 340px;
          box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 6px; color: #1a2233; }
  .sub { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
  label { display:block; font-size: 13px; color: #374151; margin: 14px 0 6px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d1d5db;
          border-radius: 8px; font-size: 14px; }
  input:focus { outline: none; border-color: #2563EB; }
  button { width: 100%; margin-top: 22px; padding: 11px; background: #2563EB; color: #fff;
           border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  button:hover { background: #1e50c8; }
  .err { background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA;
         padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="card">
  <h1>职业病危害预评价报告工作台</h1>
  <div class="sub">GBZ/T 196—2025 · 材料上传 → 章节生成 → Word 导出</div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label>用户名</label>
    <input name="username" autofocus autocomplete="username">
    <label>密码</label>
    <input name="password" type="password" autocomplete="current-password">
    <button>登 录</button>
  </form>
</div>
</body>
</html>
