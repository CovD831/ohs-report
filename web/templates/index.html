<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职业病危害预评价报告工作台</title>
<style>
:root {
  --primary: #0F6B5C; --primary-soft: #E3F0ED; --primary-strong: #0A5247;
  --tertiary: #B45309; --success: #15803D; --danger: #B91C1C;
  --neutral: #F2F4F3; --surface: #FFFFFF; --surface-muted: #ECEFEE;
  --border: #DFE3E1; --border-strong: #C4CCC8;
  --text: #1A2521; --text-secondary: #46534E; --text-muted: #8A948F;
  --radius-sm: 3px; --radius-md: 5px; --radius-lg: 8px;
}
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  margin: 0; color: var(--text); background: var(--neutral); font-size: 14px; }
.topbar { background: var(--primary-strong); color: #fff; height: 52px;
  display: flex; align-items: center; padding: 0 20px; }
.topbar .brand { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.topbar .brand-logo { width: 24px; height: 24px; border-radius: 4px; background: rgba(255,255,255,.18);
  display: flex; align-items: center; justify-content: center; font-size: 13px; }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12.5px; }
.topbar a { color: rgba(255,255,255,.85); text-decoration: none; }
.topbar a:hover { color: #fff; }
.container { max-width: 880px; margin: 0 auto; padding: 28px 20px; }
.page-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 18px; }
.drop-zone { border: 2px dashed var(--border-strong); border-radius: var(--radius-md); padding: 36px 20px;
  text-align: center; transition: border-color .15s, background .15s; cursor: pointer; }
.drop-zone:hover, .drop-zone.drag { border-color: var(--primary); background: var(--primary-soft); }
.drop-zone .big { font-size: 32px; color: var(--primary); margin-bottom: 8px; }
.drop-zone .hint { font-size: 14px; font-weight: 600; }
.drop-zone .sub { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }
.file-list { margin-top: 14px; }
.file-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 6px 10px;
  background: var(--surface-muted); border-radius: var(--radius-sm); margin-bottom: 5px; }
.file-item .status { margin-left: auto; font-size: 11px; }
.file-item .ok { color: var(--success); }
.file-item .cat { color: var(--text-muted); }
.action-row { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
.btn { border: none; border-radius: var(--radius-sm); padding: 9px 16px; font-size: 14px;
  cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-strong); }
.btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
.btn-secondary:hover { border-color: var(--primary); color: var(--primary-strong); }
.btn-primary:disabled { opacity: .5; cursor: wait; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--primary);
  border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-secondary); }
.progress-bar { flex: 1; height: 8px; background: var(--surface-muted); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary); transition: width .3s; }
.report-links { margin-top: 4px; }
.report-link { display: flex; align-items: center; gap: 10px; padding: 13px 16px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 10px; text-decoration: none; color: var(--text); }
.report-link:hover { border-color: var(--primary); }
.report-link .r-icon { color: var(--primary); }
.report-link .r-name { font-weight: 600; flex: 1; }
.report-link .r-status { font-size: 12px; color: var(--text-muted); }
.empty { text-align: center; color: var(--text-muted); padding: 24px; font-size: 13px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
.step { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; background: var(--surface); }
.step-no { width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff;
  font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.step-t { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
.step-d { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="brand-logo">预</div>职业病危害预评价报告工作台</div>
  <div class="right">
    <span id="whoami">—</span>
    <a href="/login" id="adminLink" style="display:none;">管理员登录</a>
    <a href="/admin" id="adminDash" style="display:none;">管理后台</a>
  </div>
</div>

<div class="container">
  <div class="page-title">我的报告工作台</div>
  <div class="page-sub">上传企业材料 → 一键生成职业病危害预评价报告 → 导出 Word</div>

  <div class="card">
    <div class="drop-zone" id="dropZone">
      <div class="big">↑</div>
      <div class="hint">拖拽企业材料文件到这里，或点击选择</div>
      <div class="sub">支持一次拖多个文件，系统按《建设项目职业病危害预评价资料清单》自动归类</div>
      <div class="material-check" id="materialCheck" style="margin-top:10px;text-align:left;max-height:230px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;">
        <div style="font-weight:600;font-size:13px;margin-bottom:8px;">📋 建议按以下 <b>12 项资料清单</b> 上传（<span id="matCoverage" style="color:var(--primary);">已传 0 项</span>）：</div>
        <div id="matItems" style="font-size:12px;line-height:2;color:var(--text-muted);"></div>
      </div>
      <input type="file" id="fileInput" multiple style="display:none">
      <div id="uploadProg" style="display:none;margin-top:12px;">
        <div style="font-size:12.5px;color:var(--primary);margin-bottom:4px;">
          <span class="txt">上传中 0/0</span>
        </div>
        <div style="height:8px;background:var(--border-strong);border-radius:4px;overflow:hidden;">
          <div class="bar" style="height:100%;width:0%;background:var(--primary);border-radius:4px;transition:width .2s;"></div>
        </div>
      </div>
    </div>
    <div class="file-list" id="fileList"></div>
    <div class="action-row">
      <button class="btn btn-primary" id="genBtn" onclick="generate()">⚡ 生成报告</button>
      <span style="font-size:12.5px;color:var(--text-muted);">上传后点此，自动完成识别、判定与全文生成</span>
    </div>
    <div id="myReports" style="margin-top:14px;display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;">
      <div style="font-weight:600;font-size:13px;margin-bottom:8px;">📁 我生成的报告</div>
      <div id="myReportsList" style="font-size:12.5px;color:var(--text-muted);max-height:200px;overflow:auto;"></div>
    </div>
    <div class="progress" id="progress" style="display:none;">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span id="progressText">0%</span>
    </div>
  </div>

  <div id="reportLinks"></div>
</div>

<script>
let selFiles = [];
let PID = null;

// 资料清单 12 项 (对应收集单/清单, 前端提示用户该传什么)
const MAT_ITEMS = [
  {n:1, t:'项目批文/可研/营业执照'},
  {n:2, t:'项目概况(名称/投资/面积/性质/行业/产能)'},
  {n:3, t:'原有项目情况(改扩建)'},
  {n:4, t:'公辅工程(水电气/给排水/三废)'},
  {n:5, t:'生产工艺、生产设备'},
  {n:6, t:'原料/辅料/中间品/产品+MSDS'},
  {n:7, t:'劳动组织/工种/岗位/作业内容'},
  {n:8, t:'防护措施(含技术参数/设施配置)'},
  {n:9, t:'个人防护用品/应急救援设施'},
  {n:10, t:'设计图纸(区域位置/总平面/设备布置)'},
  {n:11, t:'类比检测报告/职业卫生现场检测'},
  {n:12, t:'类比体检报告/职业健康检查'},
];

async function init() {
  const r = await fetch('/api/report');
  const d = await r.json();
  PID = d.pid;
  if (d.report) {
    const st = d.report.status;
    // 已有报告则加载状态 + 显示链接
    refreshReports();
    if (st === 'generating') {
      showProgress();
      // 找到当前报告的最新任务 jobId 并轮询
      const tj = await fetch('/api/tasks');
      const jobs = await tj.json();
      const mine = jobs.find(j => j.pid === PID && (j.status === 'running' || j.status === 'pending'));
      if (mine) pollTask(mine.id);
    }
  }
  // 身份显示
  const who = document.getElementById('whoami');
  who.textContent = PID ? '身份已就绪' : '—';
  // 初始渲染资料清单(12项, 未传)
  renderMaterialCheck({});
  // 加载"我生成的报告"列表
  loadMyReports();
  // admin 链接
  const adm = fetch('/admin', {method:'HEAD'}).then(r=>r.status);
  fetch('/api/admin/audit').then(r=>{ if(r.ok){ document.getElementById('adminDash').style.display='inline'; document.getElementById('adminLink').style.display='none'; }}).catch(()=>{});
}
async function refreshReports() {
  const r = await fetch('/api/report');
  const d = await r.json();
  const box = document.getElementById('reportLinks');
  if (!d.report) { box.innerHTML = ''; return; }
  const st = d.report.status;
  box.innerHTML = `
    <a class="report-link" href="/report/${PID}">
      <span class="r-icon">📄</span>
      <span class="r-name">我生成的报告</span>
      <span class="r-status">${st === 'generating' ? '生成中…' : st === 'ready' ? '可查看' : '草稿'}</span>
      <span class="r-status">查看 →</span>
    </a>`;
}
bindDrop();
function bindDrop() {
  const drop = document.getElementById('dropZone');
  const input = document.getElementById('fileInput');
  drop.addEventListener('click', () => input.click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('drag');
    handleDrop(e);
  });
  input.addEventListener('change', () => { addFiles(input.files); input.value = ''; });
}
// 支持文件夹拖拽: 递归读出文件夹内所有文件
async function handleDrop(e) {
  const items = e.dataTransfer.items;
  const files = [];
  if (items && items.length && items[0].webkitGetAsEntry) {
    // 遍历所有item(文件或文件夹), 文件夹递归展开
    const all = [];
    for (const it of items) {
      const entry = it.webkitGetAsEntry && it.webkitGetAsEntry();
      if (!entry) continue;
      all.push(...await readEntry(entry));
    }
    // 去掉重复(同一文件夹递归可能重复), 保序
    const seen = new Set(); const uniq = [];
    for (const f of all) {
      const key = f.name + f.size;
      if (!seen.has(key)) { seen.add(key); uniq.push(f); }
    }
    files.push(...uniq);
  } else {
    for (const f of e.dataTransfer.files) files.push(f);
  }
  addFiles(files);
}
async function readEntry(entry) {
  if (entry.isFile) {
    return new Promise(res => entry.file(f => res([f]), () => res([])));
  }
  if (entry.isDirectory) {
    const reader = entry.createReader();
    return new Promise(res => {
      const all = [];
      (function readBatch() {
        reader.readEntries(async entries => {
          if (!entries.length) return res(all);
          for (const en of entries) all.push(...await readEntry(en));
          readBatch();  // 目录可能分批返回, 循环读完
        }, () => res(all));
      })();
    });
  }
  return [];
}
async function addFiles(fileList) {
  // 逐文件上传(每个单文件<30MB, 不受 nginx client_max_body_size 30m 限制; 文件夹大文件拆成单个请求)
  // 每次上传自动新建一个项目(pid), 这批所有文件都传到该 pid; 生成也用该 pid
  const files = Array.from(fileList);
  if (!files.length) return;
  showUploadProgress(0, files.length);
  // 自动新建项目(拿到本批的 pid) — 修复"上传长兴却生成浦发"(复用旧项目)
  const all = [];
  let newPid = null;
  try {
    const c = await fetch('/api/report/upload', {method:'POST'});  // 无文件只建项目
    const cd = await c.json();
    if (cd.pid) newPid = cd.pid;
  } catch(e) {}
  // 逐个文件 POST 到该 pid (传 ?pid= 指定, 复用同一项目)
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const fd = new FormData();
    fd.append('files', f);
    const url = newPid ? `/api/report/upload?pid=${newPid}` : '/api/report/upload';
    try {
      const r = await fetch(url, {method:'POST', body:fd});
      const d = await r.json();
      if (d.ok && d.detail) {
        // 合并返回的归类结果
        for (const [cat, lst] of Object.entries(d.detail)) {
          lst.forEach(f2 => all.push({...f2, cat}));
        }
      }
    } catch (e) { /* 单个失败跳过 */ }
    showUploadProgress(i + 1, files.length);
  }
  // 记录本批项目id, 供后续"生成报告"使用
  if (newPid) window.__reportPid = newPid;
  selFiles = [];
  renderFiles(groupDetail(all), {total: files.length});
  document.getElementById('genBtn').disabled = false;
}
// 把逐文件上传的扁平结果 → 按类别分组的 detail
function groupDetail(flat) {
  const detail = {};
  flat.forEach(f => { (detail[f.cat] = detail[f.cat] || []).push(f); });
  return detail;
}
// 上传进度条
function showUploadProgress(done, total) {
  let el = document.getElementById('uploadProg');
  if (!el) {
    return; // 无进度条元素(可选), 不影响功能
  }
  el.style.display = 'block';
  el.querySelector('.bar').style.width = Math.round(done/total*100) + '%';
  el.querySelector('.txt').textContent = `上传中 ${done}/${total}`;
}
// 加载"我生成的报告"列表 (每次上传=新项目, 这里列出该身份所有报告)
async function loadMyReports() {
  try {
    const r = await fetch('/api/reports');
    const d = await r.json();
    const box = document.getElementById('myReports');
    const list = document.getElementById('myReportsList');
    if (!d.ok || !d.reports || !d.reports.length) { box.style.display='none'; return; }
    box.style.display = 'block';
    list.innerHTML = d.reports.map(rep => {
      const st = rep.status === 'ready' ? '<span style="color:var(--primary);">✅已生成</span>'
                 : (rep.status === 'generating' ? '<span style="color:orange;">🔄生成中</span>' : '草稿');
      const ind = rep.industry ? ` · ${rep.industry}` : '';
      const nm = rep.name && rep.name !== '未命名报告' ? rep.name : '未命名报告';
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);">
        <span>${nm}${ind} <span style="color:var(--text-muted);font-size:11px;">(生成${rep.gen_count}节)</span></span>
        <span><a href="/report/${rep.id}" style="font-size:12px;color:var(--primary);margin-right:10px;">查看</a>
        ${st}</span></div>`;
    }).join('');
  } catch(e) { document.getElementById('myReports').style.display = 'none'; }
}
// 自动生成: 上传后直接走 generate, 不打断用户
async function startGenerateAuto() {
  const btn = document.getElementById('genBtn');
  if (!btn || btn.disabled) return;
  try {
    const r = await fetch('/api/report/generate', {method:'POST'});
    const d = await r.json();
    if (d.job_id) {
      showProgress();
      pollTask(d.job_id);
    }
  } catch (e) { /* 保持手动生成按钮兜底 */ }
}
function renderFiles(detail, coverage) {
  const box = document.getElementById('fileList');
  if (!detail) { box.innerHTML = ''; return; }
  let html = '';
  const catNames = {C1:'项目批文',C2:'项目概况',C3:'原有项目',C4:'公辅工程',C5:'总平面图',C6:'设备清单',C7:'生产工艺',C8:'原辅材料',C9:'产品产量',C10:'岗位定员',C11:'辅助用室',C12:'采光通风',C13:'防护措施',C14:'个人防护用品',C15:'应急救援',C16:'管理经费',C17:'类比检测',uncat:'待定'};
  Object.entries(detail).forEach(([cat, files]) => {
    files.forEach(f => {
      html += `<div class="file-item"><span>📎 ${f.name}</span><span class="cat">${catNames[f.cat]||f.cat}</span><span class="status ok">已上传</span></div>`;
    });
  });
  // 缺料兜底: 缺失类别 + 影响章节
  if (coverage && (coverage.missing?.length || coverage.field_missing?.length)) {
    const core = coverage.core_missing || [];
    const others = (coverage.missing||[]).filter(m => !m.core);
    const warn = core.length ? `<span style="color:var(--danger);font-weight:600;">${core.length}项核心资料缺失</span>` : '';
    html += `<div class="coverage-warn" style="margin-top:10px;padding:10px;border-left:3px solid ${core.length?'var(--danger)':'var(--warning)'};background:${core.length?'#FFF5F5':'#FFF7E6'};">`;
      html += `<div style="font-size:13px;"><b>资料完整度 ${coverage.completeness}%</b> ${warn} <span style="color:var(--text-muted);">(字段完整度 ${coverage.field_completeness||coverage.completeness}%)</span></div>`;
      if (coverage.missing?.length) {
      html += `<div style="font-size:12px;color:var(--text-muted);margin-top:4px;">缺以下资料，对应章节将标注"待补充"：</div>
      <div style="font-size:12px;margin-top:4px;line-height:1.6;">`;
      (core.length?core:others).slice(0,6).forEach(m => {
        html += `<div>· <b>${m.name}</b> → 影响${m.impact}</div>`;
      });
      if (core.length) others.slice(0,4).forEach(m => {
        html += `<div style="color:var(--text-muted);">· ${m.name} → 影响${m.impact}</div>`;
      });
      html += `</div>`;
      }
      // 字段级缺失: 缺文件的什么字段
      const fm = coverage.field_missing || [], fp = coverage.field_partial || [];
      if (fm.length || fp.length) {
      html += `<div style="font-size:12px;color:var(--danger);margin-top:5px;">⚠ 已上传文件缺少字段：</div>
      <div style="font-size:12px;color:var(--text-muted);line-height:1.5;">`;
      fm.slice(0,5).forEach(m=>{ html += `<div>· ${m.source}：${m.desc}（缺）</div>`; });
      fp.slice(0,5).forEach(p=>{ html += `<div>· ${p.source}：${p.desc}（空${p.empty_subfields.join('/')}）</div>`; });
      html += `</div>`;
      }
      html += `</div>`;
  }
  box.innerHTML = html;
  renderMaterialCheck(detail);
  refreshReports();
}

// 渲染资料清单覆盖度 (已传/未传 12项)
function renderMaterialCheck(detail) {
  const box = document.getElementById('matItems');
  if (!box) return;
  // 已上传类别 → 对应清单项
  const catToItem = {
    'C1':[1],'C2':[2,5],'C3':[3],'C4':[4],'C5':[10],
    'C6':[5],'C7':[5],'C8':[6],'C9':[6],'C10':[7],
    'C11':[4],'C12':[8],'C13':[8],'C14':[9],'C15':[9],
    'C16':[4],'C17':[11],
  };
  const uploaded = (detail && Object.keys(detail).filter(c=>c!=='uncat' && detail[c] && detail[c].length)) || [];
  const doneItems = new Set();
  uploaded.forEach(c => (catToItem[c]||[]).forEach(n => doneItems.add(n)));
  let html = '';
  let done = 0;
  MAT_ITEMS.forEach(it => {
    const ok = doneItems.has(it.n);
    if (ok) done++;
    html += `<div style="display:flex;gap:6px;align-items:center;margin:2px 0;"><span style="width:14px;text-align:center;">${ok?'✅':'⬜'}</span><span style="${ok?'color:var(--text);':'color:var(--text-muted);'}">${it.n}. ${it.t}</span></div>`;
  });
  box.innerHTML = html;
  const cov = document.getElementById('matCoverage');
  if (cov) cov.textContent = `已传 ${done} 项/${MAT_ITEMS.length}`;
}
let timer = null;
async function generate() {
  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.textContent = '正在生成…';
  // 用上传记录的项目id (修复"上传长兴却生成浦发": 材料进哪个项目就生成哪个项目)
  const url = window.__reportPid ? ('/api/report/generate?pid=' + window.__reportPid) : '/api/report/generate';
  const r = await fetch(url, {method:'POST'});
  const d = await r.json();
  if (!d.ok) { alert('生成启动失败'); btn.disabled=false; btn.textContent='⚡ 生成报告'; return; }
  // 不留在工作台干等 —— 直接进报告阅读页, 边生成边显示
  window.location.href = '/report/' + d.pid;
}
function showProgress() {
  document.getElementById('progress').style.display = 'flex';
}
async function pollTask(jobId) {
  if (!jobId) return;
  let d;
  try {
    const r = await fetch('/api/tasks/' + jobId);
    d = await r.json();
  } catch(e) { timer = setTimeout(() => pollTask(jobId), 4000); return; }
  if (d && d.id) {
    const pct = d.total ? Math.round(d.live_progress / d.total * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = pct + '% (' + d.live_progress + '/' + d.total + ')';
    if (d.status === 'done') {
      const btn = document.getElementById('genBtn');
      btn.disabled = false; btn.textContent = '⚡ 重新生成';
      refreshReports();
      finishProgress();
      return;
    }
    if (d.status === 'failed') {
      alert('生成失败：' + (d.error||''));
      document.getElementById('genBtn').disabled = false;
      document.getElementById('genBtn').textContent = '⚡ 重新生成';
      finishProgress();
      return;
    }
  }
  timer = setTimeout(() => pollTask(jobId), 2500);
}
function finishProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '<div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div><span>完成</span>';
}
init();
</script>
</body>
</html>
