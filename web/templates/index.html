<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职业病危害预评价报告工作台</title>
<style>
:root {
  --primary: #2563EB; --primary-soft: #DBEAFE; --primary-strong: #1D4ED8;
  --tertiary: #F59E0B; --success: #16A34A; --danger: #DC2626;
  --neutral: #F8FAFC; --surface: #FFFFFF; --surface-muted: #F1F5F9;
  --border: #E2E8F0; --border-strong: #CBD5E1;
  --text: #0F172A; --text-secondary: #475569; --text-muted: #94A3B8;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: PingFang SC, Noto Sans SC, system-ui, -apple-system, sans-serif;
  font-size: 14px; line-height: 1.6; color: var(--text); background: var(--neutral); }
.mono { font-family: JetBrains Mono, SF Mono, Menlo, Consolas, monospace; font-size: 13px; }
a { color: var(--primary); text-decoration: none; }
a:hover { color: var(--primary-strong); }
</style>
</head>
<body>
<div style="max-width:1080px;margin:0 auto;padding:var(--space-xl) var(--space-md);">
  <h1 style="font-size:24px;font-weight:600;margin-bottom:var(--space-lg);">职业病危害预评价报告工作台</h1>
  <div style="display:grid;gap:var(--space-md);">
    {% for p in projects %}
    <a href="/projects/{{ p['id'] }}" class="card"
       style="display:flex;justify-content:space-between;align-items:center;
              background:var(--surface);border-radius:var(--radius-md);padding:var(--space-md);
              box-shadow:0 1px 2px rgba(15,23,42,0.04);">
      <div>
        <div style="font-weight:600;font-size:15px;color:var(--text);">{{ p['name'] }}</div>
        <div style="color:var(--text-secondary);font-size:13px;margin-top:4px;">
          行业码 <span class="mono">{{ p['industry'] }}</span> · 状态: {{ p['status'] }}
        </div>
      </div>
      <span style="color:var(--primary);">→</span>
    </a>
    {% endfor %}
  </div>
</div>
</body>
</html>
